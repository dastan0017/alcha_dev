<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img" aria-label="Сервер и передача">
<style>
@keyframes scn{0%{opacity:0}3%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes d_u{0%,2%{opacity:0}8%,100%{opacity:1}}
@keyframes d_l1{0%,49%{fill:#5B34C9}50%,100%{fill:#C4B0FF}}
@keyframes d_l2{0%,49%{fill:#EAD9C0}50%,100%{fill:#E8930C}}
@keyframes d_pg{0%,12%{transform:scaleX(0)}38%,100%{transform:scaleX(1)}}
@keyframes d_ck{0%,39%{transform:scale(0)}43%{transform:scale(1.15)}45%,100%{transform:scale(1)}}
@keyframes d_cm{0%,44%{stroke-dashoffset:22}50%,100%{stroke-dashoffset:0}}
@keyframes d_ky{0%,52%{transform:translate(104px,73px);opacity:0}56%{transform:translate(120px,70px) rotate(-8deg);opacity:1}68%,100%{transform:translate(292px,122px) rotate(0deg);opacity:1}}
@keyframes d_pf{0%,66%{stroke:#C9C2D4;fill:#FFFFFF}72%,100%{stroke:#5B34C9;fill:#F4F0F8}}
@keyframes d_s1{0%,68%{transform:scale(0)}73%{transform:scale(1)}82%,100%{transform:scale(0)}}
@keyframes d_s2{0%,70%{transform:scale(0)}75%{transform:scale(1)}84%,100%{transform:scale(0)}}
@keyframes d_s3{0%,72%{transform:scale(0)}77%{transform:scale(1)}86%,100%{transform:scale(0)}}
@media (prefers-reduced-motion: reduce){*{animation-delay:-7.2s!important;animation-play-state:paused!important}}
</style>
<rect width="440" height="230" rx="18" fill="#F8F6FC"></rect>
<g style="animation:scn 8s linear infinite">
<g style="opacity:0;animation:d_u 8s linear infinite">
<rect x="56" y="56" width="118" height="34" rx="8" fill="#FFFFFF" stroke="#17121F" stroke-opacity=".35" stroke-width="2"></rect>
<rect x="68" y="66" width="26" height="4" rx="2" fill="#D9D3E3"></rect><rect x="68" y="76" width="26" height="4" rx="2" fill="#D9D3E3"></rect>
<circle cx="150" cy="73" r="4" fill="#5B34C9" style="animation:d_l1 2s linear infinite"></circle><circle cx="136" cy="73" r="4" fill="#EDE9F2"></circle>
<rect x="56" y="98" width="118" height="34" rx="8" fill="#FFFFFF" stroke="#17121F" stroke-opacity=".35" stroke-width="2"></rect>
<rect x="68" y="108" width="26" height="4" rx="2" fill="#D9D3E3"></rect><rect x="68" y="118" width="26" height="4" rx="2" fill="#D9D3E3"></rect>
<circle cx="150" cy="115" r="4" fill="#EAD9C0" style="animation:d_l2 2s linear infinite"></circle><circle cx="136" cy="115" r="4" fill="#EDE9F2"></circle>
</g>
<rect x="56" y="152" width="118" height="10" rx="5" fill="#E9E3F1"></rect>
<rect x="56" y="152" width="118" height="10" rx="5" fill="#5B34C9" style="transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:d_pg 8s linear infinite"></rect>
<circle cx="196" cy="157" r="11" fill="#5B34C9" style="transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:d_ck 8s linear infinite"></circle>
<path d="M190.5 157 l4.5 4.5 9 -9.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:22;animation:d_cm 8s linear infinite"></path>
<rect x="252" y="100" width="132" height="44" rx="22" fill="#FFFFFF" stroke="#C9C2D4" stroke-width="2" style="animation:d_pf 8s linear infinite"></rect>
<g style="transform:translate(104px,73px);opacity:0;animation:d_ky 8s ease-in-out infinite"><circle cx="0" cy="0" r="7" fill="none" stroke="#5B34C9" stroke-width="4"></circle><rect x="7" y="-2.5" width="26" height="5" rx="2" fill="#5B34C9"></rect><rect x="22" y="2" width="4" height="7" rx="1.5" fill="#5B34C9"></rect><rect x="29" y="2" width="4" height="9" rx="1.5" fill="#5B34C9"></rect></g>
<circle cx="394" cy="96" r="4" fill="#D6336C" style="transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:d_s1 8s linear infinite"></circle>
<circle cx="404" cy="112" r="3" fill="#E8930C" style="transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:d_s2 8s linear infinite"></circle>
<circle cx="396" cy="150" r="3.5" fill="#5B34C9" style="transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:d_s3 8s linear infinite"></circle>
</g>
</svg>
